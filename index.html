<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>MoneyPilot Lite V3</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="background-overlay"></div>

<div class="app">

<!-- ===================================
        HOME PAGE
=================================== -->

<section
id="homePage"
class="page active">

<!-- ===================================
        HEADER
=================================== -->

<header class="topHeader">

<div class="profile">

<img
src="assets/profile.jpg"
class="profileImage"
alt="Profile">

<div>

<div
id="greeting"
class="hello">

Good Morning 👋

</div>

<div
class="username">

Utkarsh

</div>

</div>

</div>

<div class="monthSwitcher">

<button
id="prevMonth">

◀

</button>

<input
type="month"
id="monthFilter">

<button
id="nextMonth">

▶

</button>

</div>

</header>

<!-- ===================================
        BALANCE
=================================== -->

<section class="balanceCard">

<div class="balanceTitle">

Current Balance

</div>

<div
id="balance"
class="balanceValue">

₹0

</div>

<div class="summaryRow">

<div class="summaryCard income">

<div class="icon">

💰

</div>

<div>

<div class="label">

Income

</div>

<div id="incomeValue">

₹0

</div>

</div>

</div>

<div class="summaryCard expense">

<div class="icon">

💸

</div>

<div>

<div class="label">

Expense

</div>

<div id="expenseValue">

₹0

</div>

</div>

</div>

</div>

</section>

<!-- ===================================
        DASHBOARD
=================================== -->

<section class="stats">

<div class="glassCard">

<h4>

Fixed

</h4>

<h2 id="fixedTotal">

₹0

</h2>

</div>

<div class="glassCard">

<h4>

Variable

</h4>

<h2 id="variableTotal">

₹0

</h2>

</div>

<div class="glassCard">

<h4>

Savings

</h4>

<h2 id="savingTotal">

₹0

</h2>

</div>

</section>
