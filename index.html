<!doctype html><html><head><meta name=viewport content='width=device-width,initial-scale=1'>
<title>MoneyPilot Lite</title>
<style>
body{font-family:-apple-system,Arial;background:#f5f5f7;max-width:700px;margin:auto;padding:15px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}
button{background:#007aff;color:#fff;border:0}
li{list-style:none;background:#fff;margin:8px 0;padding:12px;border-radius:12px}
small{color:#666}
</style></head><body>
<h2>💰 MoneyPilot Lite</h2>
<div class=card><h3>Balance: ₹<span id=b>0</span></h3>
Income: ₹<span id=i>0</span><br>Expense: ₹<span id=e>0</span></div>
<div class=card>
<input id=amt type=number placeholder='Amount'>
<select id=cat><option>Food</option><option>Fuel</option><option>Shopping</option><option>Salary</option><option>EMI</option><option>Other</option></select>
<select id=typ><option value=income>Income</option><option value=expense>Expense</option></select>
<input id=note placeholder='Note'>
<button onclick='addTx()'>Save</button>
</div>
<div class=card><input id=s oninput='render()' placeholder='Search'></div>
<ul id=list></ul>
<script>
let tx=JSON.parse(localStorage.mp||"[]");
function persist(){localStorage.mp=JSON.stringify(tx)}
function addTx(){
let a=+amt.value;if(!a)return alert("Enter amount");
tx.unshift({a,c:cat.value,t:typ.value,n:note.value,d:new Date().toLocaleDateString()});
amt.value="";note.value="";persist();render();}
function del(x){tx.splice(x,1);persist();render();}
function render(){
let inc=0,exp=0,q=s.value.toLowerCase(),h="";
tx.forEach((v,k)=>{
if((v.n+v.c).toLowerCase().indexOf(q)<0)return;
if(v.t=="income")inc+=v.a;else exp+=v.a;
h+=`<li>${v.t=="income"?"🟢":"🔴"} <b>₹${v.a}</b> ${v.c}<br>${v.n}<br><small>${v.d}</small>
<button onclick='del(${k})'>Delete</button></li>`});
list.innerHTML=h;b.innerText=(inc-exp).toFixed(0);i.innerText=inc.toFixed(0);e.innerText=exp.toFixed(0);}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
