<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyPilot Lite</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="background"></div>

<div class="app">

<header class="topHeader">

<div class="profile">

<img src="assets/profile.jpg" class="profileImage">

<div>

<div class="hello" id="greeting">
Good Morning 👋
</div>

<div class="username">
Utkarsh
</div>

</div>

</div>

<div class="monthBox">

<input
type="month"
id="monthFilter">

</div>

</header>


<section class="balanceCard">

<div class="balanceTitle">

Current Balance

</div>

<div class="balanceValue" id="balance">

₹0

</div>

<div class="summaryRow">

<div class="summaryCard income">

<div class="icon">

📈

</div>

<div>

<div class="label">
Income
</div>

<div id="incomeValue">

₹0

</div>

</div>

</div>

<div class="summaryCard expense">

<div class="icon">

📉

</div>

<div>

<div class="label">
Expense
</div>

<div id="expenseValue">

₹0

</div>

</div>

</div>

</div>

</section>


<section class="stats">

<div class="glassCard">

<h4>

Fixed Expenses

</h4>

<h2 id="fixedTotal">

₹0

</h2>

</div>

<div class="glassCard">

<h4>

Variable Expenses

</h4>

<h2 id="variableTotal">

₹0

</h2>

</div>

<div class="glassCard">

<h4>

Savings

</h4>

<h2 id="savingTotal">

₹0

</h2>

</div>

</section>


<section class="addCard">

<h2>

Add Transaction

</h2>

<input
id="amount"
type="number"
placeholder="Amount">

<input
id="note"
placeholder="Note">

<input
id="date"
type="date">

<select id="type">

<option value="income">

Income

</option>

<option value="expense">

Expense

</option>

</select>

<select id="category">

<option>Food</option>

<option>Fuel</option>

<option>Shopping</option>

<option>Rent</option>

<option>EMI</option>

<option>Insurance</option>

<option>Salary</option>

<option>Investment</option>

<option>Other</option>

</select>

<label class="checkRow">

<input
type="checkbox"
id="fixedExpense">

Fixed Monthly Expense

</label>

<label class="checkRow">

<input
type="checkbox"
id="repeatMonthly">

Repeat Every Month

</label>

<button id="saveButton">

Save Transaction

</button>

</section>
<!-- Bills Section -->

<section class="billsCard">

    <div class="sectionHeader">

        <h2>Monthly Bills</h2>

        <button id="addBillBtn">
            + Add Bill
        </button>

    </div>

    <div id="billsContainer">

        <!-- Bills JS se load honge -->

    </div>

</section>


<!-- Recent Transactions -->

<section class="transactionCard">

    <div class="sectionHeader">

        <h2>

            Recent Transactions

        </h2>

    </div>

    <div class="tableContainer">

        <table>

            <thead>

            <tr>

                <th>Date</th>

                <th>Category</th>

                <th>Note</th>

                <th>Amount</th>

                <th></th>

            </tr>

            </thead>

            <tbody id="transactionTable">

            </tbody>

        </table>

    </div>

</section>


<!-- Charts -->

<section class="chartCard">

    <h2>

        Monthly Overview

    </h2>

    <canvas id="expenseChart"></canvas>

</section>


<footer class="bottomNav">

    <button class="navItem active">

        🏠

        <span>

            Home

        </span>

    </button>

    <button class="navItem">

        📊

        <span>

            Reports

        </span>

    </button>

    <button class="navItem">

        ➕

        <span>

            Add

        </span>

    </button>

    <button class="navItem">

        💳

        <span>

            Bills

        </span>

    </button>

    <button class="navItem">

        ⚙️

        <span>

            Settings

        </span>

    </button>

</footer>


</div>

<script src="storage.js"></script>

<script src="dashboard.js"></script>

<script src="transactions.js"></script>

<script src="bills.js"></script>

<script src="app.js"></script>

</body>

</html>
