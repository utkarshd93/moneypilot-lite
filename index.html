<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

MoneyPilot AI

</title>

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="background-overlay"></div>

<div class="app">

<!-- ==========================================
            Header
========================================== -->

<header class="topHeader">

<div class="profile">

<img

src="assets/profile.jpg"

class="profileImage"

alt="Profile">

<div>

<div
id="greeting"
class="hello">

Good Morning 👋

</div>

<div class="username">

Utkarsh

</div>

</div>

</div>

<div class="monthBox">

<input

type="month"

id="monthFilter">

</div>

</header>

<!-- ==========================================
            Balance
========================================== -->

<section class="balanceCard">

<div class="balanceTitle">

Current Balance

</div>

<div
id="balance"
class="balanceValue">

₹0

</div>

<div class="summaryRow">

<div class="summaryCard">

<div class="icon">

📈

</div>

<div>

<div class="label">

Income

</div>

<h3
id="incomeValue">

₹0

</h3>

</div>

</div>

<div class="summaryCard">

<div class="icon">

📉

</div>

<div>

<div class="label">

Expense

</div>

<h3
id="expenseValue">

₹0

</h3>

</div>

</div>

</div>

</section>

<!-- ==========================================
        Dashboard
========================================== -->

<section class="stats">

<div class="glassCard">

<h4>

Fixed

</h4>

<h2
id="fixedTotal">

₹0

</h2>

</div>

<div class="glassCard">

<h4>

Variable

</h4>

<h2
id="variableTotal">

₹0

</h2>

</div>

<div class="glassCard">

<h4>

Savings

</h4>

<h2
id="savingTotal">

₹0

</h2>

</div>

</section>

<!-- ==========================================
        Quick Actions
========================================== -->

<section class="quickActions">

<button
id="incomeBtn">

💰 Income

</button>

<button
id="expenseBtn">

💸 Expense

</button>

<button
id="scanBtn">

📷 Scan

</button>

</section>
<!-- ==========================================
            Add Transaction
========================================== -->

<section class="addCard">

<div class="sectionHeader">

<h2>

Add Transaction

</h2>

</div>

<input

id="amount"

type="number"

placeholder="₹ Enter Amount">

<input

id="note"

type="text"

placeholder="Description">

<input

id="date"

type="date">

<select id="type">

<option value="income">

💰 Income

</option>

<option value="expense">

💸 Expense

</option>

</select>

<select id="category">

<option value="Food">

🍔 Food

</option>

<option value="Fuel">

⛽ Fuel

</option>

<option value="Shopping">

🛍 Shopping

</option>

<option value="Salary">

💼 Salary

</option>

<option value="Investment">

📈 Investment

</option>

<option value="Travel">

✈️ Travel

</option>

<option value="Health">

🏥 Health

</option>

<option value="Recharge">

📱 Recharge

</option>

<option value="Entertainment">

🎬 Entertainment

</option>

<option value="Other">

📦 Other

</option>

</select>

<div class="checkRow">

<label>

<input

type="checkbox"

id="fixedExpense">

Fixed Expense

</label>

</div>

<div class="checkRow">

<label>

<input

type="checkbox"

id="repeatMonthly">

Repeat Every Month

</label>

</div>

<button

id="saveButton">

💾 Save Transaction

</button>

</section>

<!-- ==========================================
        Recent Transactions
========================================== -->

<section class="transactionCard">

<div class="sectionHeader">

<h2>

Recent Transactions

</h2>

</div>

<div

id="transactionList"

class="transactionList">

<!-- Cards will come here -->

</div>

</section>
<!-- ==========================================
                Settings
========================================== -->

<section class="settingsCard">

<div class="sectionHeader">

<h2>

Settings

</h2>

</div>

<div class="settingsGrid">

<button id="exportBtn">

📤 Export Backup

</button>

<button id="importBtn">

📥 Import Backup

</button>

<button id="resetBtn">

🗑 Reset Data

</button>

</div>

</section>

<!-- Hidden Import -->

<input

id="backupFile"

type="file"

accept=".json"

style="display:none;">

<!-- ==========================================
            Empty State
========================================== -->

<div

id="emptyState"

style="display:none;">

<div style="font-size:70px;">

💸

</div>

<h2>

No Transactions Yet

</h2>

<p>

Start by adding your first income or expense.

</p>

</div>

<!-- ==========================================
                Toast
========================================== -->

<div id="toast">

Saved Successfully

</div>

<!-- ==========================================
            Floating Action Button
========================================== -->

<div

class="fab"

id="fabButton">

➕

</div>

<!-- ==========================================
            Bottom Navigation
========================================== -->

<nav class="bottomNav">

<button

class="navItem active"

id="navHome">

🏠

<span>

Home

</span>

</button>

<button

class="navItem"

id="navTransactions">

📋

<span>

History

</span>

</button>

<button

class="navItem"

id="navReports">

📈

<span>

Reports

</span>

</button>

<button

class="navItem"

id="navSettings">

⚙️

<span>

Settings

</span>

</button>

</nav>

<footer class="version">

MoneyPilot AI

v2.0

</footer>
<!-- ==========================================
        JavaScript Files
========================================== -->

<script src="storage.js"></script>

<script src="transactions.js"></script>

<script src="dashboard.js"></script>

<script src="app.js"></script>

</div>

</body>

</html>
