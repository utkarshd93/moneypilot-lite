<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyPilot Lite v2</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:-apple-system,Arial;background:#f4f4f4;max-width:700px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0}
button,input{width:100%;padding:10px;margin:6px 0}
pre{white-space:pre-wrap;background:#eee;padding:10px;border-radius:8px;max-height:250px;overflow:auto}
</style>
</head>
<body>
<h2>💰 MoneyPilot Lite v2</h2>

<div class="card">
<h3>📄 Import PDF</h3>
<input type="file" id="pdf" accept=".pdf">
<button onclick="readPdf()">Read PDF</button>
</div>

<div class="card">
<h3>🖼️ Import Image (OCR)</h3>
<input type="file" id="img" accept="image/*">
<button onclick="readImage()">Read Image</button>
</div>

<div class="card">
<h3>Extracted Text</h3>
<pre id="out">Nothing imported yet.</pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

window.readPdf=async()=>{
 const f=document.getElementById("pdf").files[0];
 if(!f){alert("Select PDF");return;}
 const buf=await f.arrayBuffer();
 const pdf=await pdfjsLib.getDocument({data:buf}).promise;
 let txt="";
 for(let i=1;i<=pdf.numPages;i++){
   const p=await pdf.getPage(i);
   const c=await p.getTextContent();
   txt+=c.items.map(x=>x.str).join(" ")+"\n";
 }
 out.textContent=txt;
};

window.readImage=async()=>{
 const f=document.getElementById("img").files[0];
 if(!f){alert("Select image");return;}
 out.textContent="Reading image...";
 const r=await Tesseract.recognize(f,"eng");
 out.textContent=r.data.text;
};
</script>
</body>
</html>
